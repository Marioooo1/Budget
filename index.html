<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Catatan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #F4F7FA;
  --surface: #FFFFFF;
  --ink:     #1C2130;
  --muted:   #7B8296;
  --border:  #E4E8F0;
  --navy:    #1C2130;
  --green:   #1B8C5E;
  --green-bg:#E8F5EF;
  --orange:  #E8853B;
  --orange-bg:#FFF4EB;
  --red:     #D64045;
  --red-bg:  #FFF0F0;
  --blue:    #3B6EF0;
  --blue-bg: #EEF3FF;
  --purple:  #6C47FF;
  --purple-bg:#F3EFFF;
  --mono:    'JetBrains Mono', 'Cascadia Code', monospace;
  --sans:    'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
  --radius:  12px;
  --radius-sm: 8px;
}

html { background: var(--bg); }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  padding-bottom: calc(env(safe-area-inset-bottom) + 24px);
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
header {
  background: var(--navy);
  color: #fff;
  padding: 20px 20px 28px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.brand {
  font-family: var(--mono);
  font-size: 0.65rem;
  font-weight: 600;
  color: rgba(255,255,255,0.5);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.brand b { color: #fff; font-weight: 700; }

.month-nav {
  display: flex;
  align-items: center;
  gap: 0;
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 500;
  background: rgba(255,255,255,0.08);
  border-radius: 50px;
  padding: 2px;
}
.month-nav button {
  background: none;
  border: none;
  color: rgba(255,255,255,0.7);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 0.85rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  transition: all 0.15s;
}
.month-nav button:hover { background: rgba(255,255,255,0.15); color: #fff; }
.month-nav .month-label {
  min-width: 124px;
  text-align: center;
  color: #fff;
  font-weight: 600;
}

/* Hero — total + daily budget */
.hero-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.hero-card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius);
  padding: 16px;
  backdrop-filter: blur(4px);
}
.hero-card .h-label {
  font-size: 0.62rem;
  font-family: var(--mono);
  color: rgba(255,255,255,0.5);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}
.hero-card .h-amount {
  font-family: var(--mono);
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.hero-card.total .h-amount { font-size: 1.6rem; }
.hero-card.daily { background: rgba(27,140,94,0.2); border-color: rgba(27,140,94,0.35); }
.hero-card.daily .h-amount { color: #5BECAD; }

/* Budget bar */
.budget-bar-wrap {
  margin-top: 16px;
  background: rgba(255,255,255,0.08);
  border-radius: 50px;
  height: 6px;
  overflow: hidden;
}
.budget-bar-fill {
  height: 100%;
  background: #fff;
  border-radius: 50px;
  transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
}
.budget-bar-wrap .info-row {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
  font-size: 0.62rem;
  font-family: var(--mono);
  color: rgba(255,255,255,0.5);
}

/* ── Main ── */
main {
  max-width: 600px;
  margin: 0 auto;
  padding: 18px 16px;
}

/* Summary row */
.summary-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 22px;
}
.summary-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  border: 1px solid var(--border);
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.summary-card .s-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  margin-bottom: 10px;
}
.summary-card .s-val {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: -0.02em;
}
.summary-card .s-lbl {
  font-size: 0.65rem;
  color: var(--muted);
  margin-top: 2px;
  font-weight: 500;
}

/* Section */
.section-label {
  font-family: var(--mono);
  font-size: 0.62rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}

/* ── Daily Budget Insight ── */
.insight-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 22px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.insight-card.good { border-left: 4px solid var(--green); }
.insight-card.warn { border-left: 4px solid var(--orange); }
.insight-card.bad  { border-left: 4px solid var(--red); }
.insight-card .i-head {
  font-family: var(--mono);
  font-size: 0.62rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}
.insight-card .i-big {
  font-family: var(--mono);
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.insight-card .i-sub {
  font-size: 0.72rem;
  color: var(--muted);
  margin-top: 4px;
  line-height: 1.4;
}

/* ── Form slab ── */
.form-slab {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 22px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.form-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.form-row:last-child { margin-bottom: 0; }
.field { flex: 1; min-width: 100px; }
.field label {
  display: block;
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 4px;
  font-family: var(--mono);
}
.field input, .field select {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 0.88rem;
  font-family: var(--sans);
  background: #F9FAFC;
  color: var(--ink);
  transition: all 0.15s;
}
.field input::placeholder { color: var(--muted); opacity: 0.5; }
.field input:focus, .field select:focus {
  outline: none;
  border-color: var(--blue);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(59,110,240,0.08);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 10px 18px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.8rem;
  font-weight: 600;
  font-family: var(--sans);
  cursor: pointer;
  transition: all 0.12s;
  letter-spacing: -0.01em;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--navy);
  color: #fff;
  width: 100%;
  padding: 12px;
  font-size: 0.82rem;
  font-family: var(--mono);
  letter-spacing: 0.02em;
  box-shadow: 0 4px 12px rgba(28,33,48,0.2);
}
.btn-primary:hover { background: #2D3348; }
.btn-sm { padding: 7px 16px; font-size: 0.68rem; width: auto; font-family: var(--mono); background: var(--navy); color: #fff; }
.budget-row { display: flex; gap: 8px; align-items: end; }
.budget-row .field { flex: 1; }

/* ── Filter pills ── */
.pill-strip {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-bottom: 12px;
  overflow-x: auto;
  scrollbar-width: none;
}
.pill-strip::-webkit-scrollbar { display: none; }
.pill {
  padding: 5px 12px;
  border-radius: 50px;
  font-size: 0.66rem;
  font-weight: 600;
  font-family: var(--mono);
  cursor: pointer;
  white-space: nowrap;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  transition: all 0.12s;
}
.pill:hover { border-color: var(--blue); color: var(--blue); }
.pill.active {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}

/* ── Expense list ── */
.expense-group { margin-bottom: 14px; }
.expense-date-head {
  font-family: var(--mono);
  font-size: 0.62rem;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
  padding: 0 2px;
}

.expense-list {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.03);
}
.expense-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  transition: background 0.1s;
}
.expense-row + .expense-row { border-top: 1px solid var(--border); }
.expense-row:active { background: #F8F9FC; }

.expense-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.expense-body { flex: 1; min-width: 0; }
.expense-body .e-desc {
  font-size: 0.84rem;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.expense-body .e-meta {
  font-size: 0.65rem;
  color: var(--muted);
  font-family: var(--mono);
  margin-top: 1px;
}
.expense-amt {
  font-family: var(--mono);
  font-weight: 600;
  font-size: 0.84rem;
  white-space: nowrap;
  letter-spacing: -0.02em;
}
.expense-del {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 4px 6px;
  font-size: 1.1rem;
  line-height: 1;
  transition: color 0.12s;
  flex-shrink: 0;
  border-radius: 50%;
  width: 28px; height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.expense-del:hover { color: var(--red); background: var(--red-bg); }

/* ── Breakdown ── */
.breakdown-slab {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 22px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.03);
}
.breakdown-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 0;
}
.breakdown-row + .breakdown-row { border-top: 1px solid var(--border); }
.breakdown-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.breakdown-name { font-size: 0.78rem; font-weight: 500; min-width: 60px; }
.breakdown-bar-wrap { flex: 1; height: 5px; background: #F0F2F5; border-radius: 50px; overflow: hidden; }
.breakdown-bar { height: 100%; border-radius: 50px; transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
.breakdown-amt { font-family: var(--mono); font-size: 0.73rem; font-weight: 600; min-width: 70px; text-align: right; }
.breakdown-pct { font-family: var(--mono); font-size: 0.62rem; color: var(--muted); min-width: 32px; text-align: right; }

/* ── Empty ── */
.empty {
  text-align: center;
  padding: 28px 16px;
  color: var(--muted);
  font-size: 0.75rem;
  font-family: var(--mono);
}
.empty-icon { font-size: 1.3rem; margin-bottom: 4px; opacity: 0.35; display: block; }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--navy);
  color: #fff;
  padding: 10px 22px;
  border-radius: 50px;
  font-size: 0.7rem;
  font-family: var(--mono);
  z-index: 100;
  opacity: 0;
  transition: opacity 0.18s;
  pointer-events: none;
  box-shadow: 0 8px 24px rgba(28,33,48,0.3);
}
.toast.show { opacity: 1; }

/* ── Responsive ── */
@media (min-width: 600px) {
  main { padding: 24px 20px; }
  header { padding: 24px 28px 32px; }
  .form-row { flex-wrap: nowrap; }
  .hero-card .h-amount { font-size: 1.4rem; }
  .hero-card.total .h-amount { font-size: 1.8rem; }
}
@media (max-width: 380px) {
  .hero-grid { gap: 8px; }
  .hero-card { padding: 12px; }
  .hero-card .h-amount { font-size: 1rem; }
  .hero-card.total .h-amount { font-size: 1.3rem; }
}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="brand"><b>Catatan</b> Budget</div>
    <div class="month-nav">
      <button onclick="prevMonth()">&#8249;</button>
      <span class="month-label" id="monthLabel"></span>
      <button onclick="nextMonth()">&#8250;</button>
    </div>
  </div>
  <div class="hero-grid">
    <div class="hero-card total">
      <div class="h-label">Total bulan ini</div>
      <div class="h-amount" id="heroTotal">Rp 0</div>
    </div>
    <div class="hero-card daily" id="heroDaily">
      <div class="h-label">Budget harian</div>
      <div class="h-amount" id="heroDailyAmt">Rp 0</div>
    </div>
  </div>
  <div class="budget-bar-wrap">
    <div class="budget-bar-fill" id="budgetBar" style="width:0%"></div>
    <div class="info-row">
      <span id="headerSpent">Rp 0 terpakai</span>
      <span id="headerRemaining">Atur budget dulu</span>
    </div>
  </div>
</header>

<main>

  <!-- DAILY BUDGET INSIGHT -->
  <div class="insight-card" id="insightCard">
    <div class="i-head" id="insightHead">Budget harian</div>
    <div class="i-big" id="insightBig">Atur budget dulu</div>
    <div class="i-sub" id="insightSub">Tentukan budget bulanan untuk lihat alokasi harian</div>
  </div>

  <!-- Budget setting -->
  <div class="section-label">Budget</div>
  <div class="form-slab">
    <div class="budget-row">
      <div class="field">
        <label for="budgetInput">Jumlah per bulan</label>
        <input type="number" id="budgetInput" placeholder="Contoh: 3.000.000" min="0" step="50000">
      </div>
      <button class="btn btn-sm" onclick="saveBudget()">Simpan</button>
    </div>
  </div>

  <!-- Add expense -->
  <div class="section-label">Catat pengeluaran</div>
  <div class="form-slab">
    <div class="form-row">
      <div class="field" style="flex:2">
        <label for="amount">Jumlah (Rp)</label>
        <input type="number" id="amount" placeholder="0" min="1" autofocus autocomplete="off" inputmode="numeric">
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label for="category">Kategori</label>
        <select id="category">
          <option value="🍔 Makanan">Makanan</option>
          <option value="🚗 Transportasi">Transportasi</option>
          <option value="🛒 Belanja">Belanja</option>
          <option value="🎮 Hiburan">Hiburan</option>
          <option value="📄 Tagihan">Tagihan</option>
          <option value="💊 Kesehatan">Kesehatan</option>
          <option value="📚 Pendidikan">Pendidikan</option>
          <option value="📦 Lainnya">Lainnya</option>
        </select>
      </div>
      <div class="field">
        <label for="date">Tanggal</label>
        <input type="date" id="date">
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label for="desc">Catatan</label>
        <input type="text" id="desc" placeholder="Nasi goreng, Bensin..." maxlength="60" autocomplete="off">
      </div>
    </div>
    <div class="form-row">
      <button class="btn btn-primary" onclick="addExpense()">Tambah</button>
    </div>
  </div>

  <!-- Breakdown -->
  <div class="section-label">Rincian kategori</div>
  <div class="breakdown-slab" id="breakdownContainer">
    <div class="empty"><span class="empty-icon">&#9670;</span>Belum ada data</div>
  </div>

  <!-- Expense list -->
  <div class="section-label">Riwayat</div>
  <div class="pill-strip" id="filterPills">
    <button class="pill active" data-cat="all">Semua</button>
  </div>
  <div id="expenseContainer">
    <div class="empty"><span class="empty-icon">&#9670;</span>Belum ada catatan</div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
let currentDate = new Date();
let expenses = [];
let budgets = {};
let activeFilter = 'all';

const categories = ['🍔 Makanan', '🚗 Transportasi', '🛒 Belanja', '🎮 Hiburan', '📄 Tagihan', '💊 Kesehatan', '📚 Pendidikan', '📦 Lainnya'];
const catColors = {
  '🍔 Makanan': '#D64045', '🚗 Transportasi': '#3B6EF0', '🛒 Belanja': '#1B8C5E',
  '🎮 Hiburan': '#E8853B', '📄 Tagihan': '#6C47FF', '💊 Kesehatan': '#E0558A',
  '📚 Pendidikan': '#0BA5B8', '📦 Lainnya': '#7B8296'
};
const catLabels = {
  '🍔 Makanan': 'Makanan', '🚗 Transportasi': 'Transportasi', '🛒 Belanja': 'Belanja',
  '🎮 Hiburan': 'Hiburan', '📄 Tagihan': 'Tagihan', '💊 Kesehatan': 'Kesehatan',
  '📚 Pendidikan': 'Pendidikan', '📦 Lainnya': 'Lainnya'
};

// ── localStorage ──
function loadData() {
  expenses = JSON.parse(localStorage.getItem('catatan_expenses') || '[]');
  budgets = JSON.parse(localStorage.getItem('catatan_budgets') || '{}');
  renderAll();
}
function saveExpenses() { localStorage.setItem('catatan_expenses', JSON.stringify(expenses)); }
function saveBudgets() { localStorage.setItem('catatan_budgets', JSON.stringify(budgets)); }

function formatRp(n) { return 'Rp ' + n.toLocaleString('id-ID'); }
function getMonthKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function monthName(d) {
  var n = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  return n[d.getMonth()] + ' ' + d.getFullYear();
}
function getMonthExpenses() {
  var key = getMonthKey(currentDate);
  return expenses.filter(function(e){ return e.monthKey === key; });
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

// ── Daily budget logic ──
function calcDaily() {
  var monthExp = getMonthExpenses();
  var total = monthExp.reduce(function(s,e){ return s + e.amount; }, 0);
  var budget = budgets[getMonthKey(currentDate)] || 0;
  var remaining = budget - total;

  var now = new Date();
  var daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
  var today = now.getDate();
  var isCurrentMonth = (getMonthKey(currentDate) === getMonthKey(now));
  var daysLeft = isCurrentMonth ? (daysInMonth - today + 1) : daysInMonth;
  var daily = daysLeft > 0 ? Math.floor(remaining / daysLeft) : remaining;

  return { total: total, budget: budget, remaining: remaining, daysLeft: daysLeft, daily: daily, isCurrentMonth: isCurrentMonth };
}

// ── Render ──
function renderAll() {
  renderMonthLabel();
  renderHero();
  renderInsight();
  renderBreakdown();
  renderFilters();
  renderExpenses();
}

function renderMonthLabel() {
  document.getElementById('monthLabel').textContent = monthName(currentDate);
}

function renderHero() {
  var d = calcDaily();
  var pct = d.budget > 0 ? Math.min(100, Math.round(d.total / d.budget * 100)) : 0;
  var bar = document.getElementById('budgetBar');
  bar.style.width = (d.budget > 0 ? pct : 0) + '%';
  bar.style.background = pct > 100 ? '#FCA5A5' : pct > 80 ? '#FCD34D' : '#fff';

  document.getElementById('heroTotal').textContent = formatRp(d.total);

  // Daily budget in hero
  var dailyEl = document.getElementById('heroDailyAmt');
  if (d.budget > 0 && d.remaining > 0) {
    dailyEl.textContent = formatRp(d.daily);
    dailyEl.style.color = '#5BECAD';
  } else if (d.budget > 0 && d.remaining <= 0) {
    dailyEl.textContent = 'Over!';
    dailyEl.style.color = '#FCA5A5';
  } else {
    dailyEl.textContent = '--';
    dailyEl.style.color = 'rgba(255,255,255,0.5)';
  }

  document.getElementById('headerSpent').textContent = formatRp(d.total) + ' terpakai';
  var rem = d.remaining;
  document.getElementById('headerRemaining').textContent = d.budget > 0
    ? (rem >= 0 ? formatRp(rem) + ' tersisa' : 'Over ' + formatRp(Math.abs(rem)))
    : 'Atur budget dulu';

  var bi = document.getElementById('budgetInput');
  if (!bi.value) bi.value = d.budget || '';
}

function renderInsight() {
  var d = calcDaily();
  var card = document.getElementById('insightCard');
  var head = document.getElementById('insightHead');
  var big = document.getElementById('insightBig');
  var sub = document.getElementById('insightSub');

  card.className = 'insight-card';
  if (d.budget <= 0) {
    head.textContent = 'Siapkan budget';
    big.textContent = 'Atur budget dulu';
    big.style.color = 'var(--muted)';
    sub.textContent = 'Tentukan budget bulanan di kolom di bawah, lalu lihat alokasi harianmu';
    return;
  }

  var spentToday = 0;
  if (d.isCurrentMonth) {
    var todayStr = new Date().toISOString().split('T')[0];
    var monthExp = getMonthExpenses();
    spentToday = monthExp.filter(function(e){ return e.date === todayStr; }).reduce(function(s,e){ return s + e.amount; }, 0);
  }

  if (d.remaining <= 0) {
    card.className = 'insight-card bad';
    head.textContent = 'Over budget';
    big.textContent = 'Over ' + formatRp(Math.abs(d.remaining));
    big.style.color = 'var(--red)';
    sub.textContent = 'Budget bulanan sudah terlampaui. Kurangi pengeluaran sampai bulan depan.';
  } else if (d.daily < 20000 && d.budget > 0) {
    card.className = 'insight-card warn';
    head.textContent = 'Budget harian tersisa';
    big.textContent = formatRp(d.daily) + ' / hari';
    big.style.color = 'var(--orange)';
    sub.textContent = 'Hemat! Sisa ' + d.daysLeft + ' hari dengan budget ketat. Hari ini sudah keluar ' + formatRp(spentToday) + '.';
  } else {
    card.className = 'insight-card good';
    head.textContent = 'Budget harian tersedia';
    big.textContent = formatRp(d.daily) + ' / hari';
    big.style.color = 'var(--green)';
    var hint = d.isCurrentMonth
      ? 'Kamu bisa pakai sampai ' + formatRp(d.daily) + ' per hari selama ' + d.daysLeft + ' hari ke depan.'
      : 'Rata-rata harian untuk bulan ini.';
    sub.textContent = hint + ' Hari ini: ' + formatRp(spentToday) + '.';
  }
}

function renderBreakdown() {
  var container = document.getElementById('breakdownContainer');
  var monthExp = getMonthExpenses();
  var total = monthExp.reduce(function(s,e){ return s + e.amount; }, 0);
  if (total === 0) {
    container.innerHTML = '<div class="empty"><span class="empty-icon">&#9670;</span>Belum ada data</div>';
    return;
  }
  var byCat = {};
  categories.forEach(function(c){ byCat[c] = 0; });
  monthExp.forEach(function(e){
    var cat = e.category || '📦 Lainnya';
    byCat[cat] = (byCat[cat] || 0) + e.amount;
  });
  var html = '';
  categories.forEach(function(c){
    var amt = byCat[c] || 0;
    if (amt === 0) return;
    var pct = Math.round(amt / total * 100);
    var color = catColors[c] || '#7B8296';
    html += '<div class="breakdown-row">' +
      '<span class="breakdown-dot" style="background:' + color + '"></span>' +
      '<span class="breakdown-name">' + (catLabels[c] || 'Lainnya') + '</span>' +
      '<span class="breakdown-bar-wrap"><span class="breakdown-bar" style="width:' + pct + '%;background:' + color + '"></span></span>' +
      '<span class="breakdown-amt">' + formatRp(amt) + '</span>' +
      '<span class="breakdown-pct">' + pct + '%</span>' +
      '</div>';
  });
  container.innerHTML = html;
}

function renderFilters() {
  var container = document.getElementById('filterPills');
  var monthExp = getMonthExpenses();
  var usedCats = {};
  monthExp.forEach(function(e){ usedCats[e.category || '📦 Lainnya'] = true; });
  var html = '<button class="pill' + (activeFilter === 'all' ? ' active' : '') + '" data-cat="all">Semua</button>';
  categories.forEach(function(c){
    if (usedCats[c]) {
      html += '<button class="pill' + (activeFilter === c ? ' active' : '') + '" data-cat="' + c + '">' + (catLabels[c] || 'Lainnya') + '</button>';
    }
  });
  container.innerHTML = html;
  container.querySelectorAll('.pill').forEach(function(btn){
    btn.addEventListener('click', function(){
      activeFilter = this.dataset.cat;
      renderFilters();
      renderExpenses();
    });
  });
}

function renderExpenses() {
  var container = document.getElementById('expenseContainer');
  var monthExp = getMonthExpenses();
  var filtered = activeFilter === 'all' ? monthExp : monthExp.filter(function(e){ return (e.category || '📦 Lainnya') === activeFilter; });
  filtered.sort(function(a,b){ return b.id - a.id; });

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty"><span class="empty-icon">&#9670;</span>Belum ada catatan</div>';
    return;
  }

  var groups = {};
  filtered.forEach(function(e){
    var dk = e.date;
    if (!groups[dk]) groups[dk] = [];
    groups[dk].push(e);
  });

  var sortedDates = Object.keys(groups).sort().reverse();
  var html = '';
  sortedDates.forEach(function(dateKey){
    var dt = new Date(dateKey);
    var today = new Date();
    var yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
    var headerLabel;
    if (dateKey === today.toISOString().split('T')[0]) headerLabel = 'Hari ini';
    else if (dateKey === yesterday.toISOString().split('T')[0]) headerLabel = 'Kemarin';
    else headerLabel = dt.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
    var dayTotal = groups[dateKey].reduce(function(s,e){ return s + e.amount; }, 0);
    html += '<div class="expense-group">' +
      '<div class="expense-date-head">' + headerLabel + '  &middot;  ' + formatRp(dayTotal) + '</div>' +
      '<div class="expense-list">';
    groups[dateKey].forEach(function(e){
      var cat = e.category || '📦 Lainnya';
      var color = catColors[cat] || '#7B8296';
      html += '<div class="expense-row">' +
        '<span class="expense-dot" style="background:' + color + '"></span>' +
        '<div class="expense-body">' +
          '<div class="e-desc">' + (e.desc || catLabels[cat] || 'Lainnya') + '</div>' +
          '<div class="e-meta">' + (catLabels[cat] || 'Lainnya') + '</div>' +
        '</div>' +
        '<span class="expense-amt">' + formatRp(e.amount) + '</span>' +
        '<button class="expense-del" onclick="deleteExpense(' + e.id + ')" aria-label="Hapus">&times;</button>' +
        '</div>';
    });
    html += '</div></div>';
  });
  container.innerHTML = html;
}

// ── Actions ──
function addExpense() {
  var amtEl = document.getElementById('amount');
  var cat = document.getElementById('category').value;
  var dateVal = document.getElementById('date').value || new Date().toISOString().split('T')[0];
  var descRaw = document.getElementById('desc').value.trim();
  var desc = descRaw || catLabels[cat] || '';
  var amount = parseInt(amtEl.value);
  if (!amount || amount <= 0) { showToast('Jumlah belum diisi'); amtEl.focus(); return; }

  expenses.push({
    id: Date.now(),
    amount: amount,
    category: cat,
    date: dateVal,
    desc: desc,
    monthKey: dateVal.substring(0,7)
  });
  saveExpenses();
  amtEl.value = ''; document.getElementById('desc').value = '';
  amtEl.focus(); activeFilter = 'all'; loadData();
  showToast('Tercatat');
}

function deleteExpense(id) {
  if (!confirm('Hapus catatan ini?')) return;
  expenses = expenses.filter(function(e){ return e.id !== id; });
  saveExpenses();
  loadData(); showToast('Terhapus');
}

function saveBudget() {
  var val = parseInt(document.getElementById('budgetInput').value) || 0;
  var key = getMonthKey(currentDate);
  budgets[key] = val;
  saveBudgets();
  loadData();
  showToast(val > 0 ? 'Budget disimpan' : 'Budget direset');
}

function prevMonth() {
  currentDate.setMonth(currentDate.getMonth() - 1);
  activeFilter = 'all'; renderAll();
}
function nextMonth() {
  currentDate.setMonth(currentDate.getMonth() + 1);
  activeFilter = 'all'; renderAll();
}

document.getElementById('date').value = new Date().toISOString().split('T')[0];
document.getElementById('amount').addEventListener('keydown', function(e){
  if (e.key === 'Enter') addExpense();
});
loadData();
</script>
</body>
